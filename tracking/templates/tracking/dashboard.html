<!DOCTYPE html>
<html>
<head>
    <title>Главная страница</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Time Tracking</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">Привет, {{ user.first_name }}!</span>
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-link nav-link" style="border: none; background: none;">
                    Выйти
                </button>
            </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Добро пожаловать в систему учета времени!</h1>
        <p>Вы успешно вошли в систему.</p>
        
        <div class="mt-4">
            <a href="{% url 'tracking:time_entry_create' %}" class="btn btn-primary">
                Добавить запись времени
            </a>
            <a href="{% url 'tracking:time_entries_list' %}" class="btn btn-secondary">
                Мои записи
            </a>
        </div>
    </div>
</body>
</html>
